[package]
name = "rgb-controller-msi-creator-a16"
version = "0.1.0"
edition = "2021"
description = "Userspace USB HID driver for MSI Creator A16 AI+ RGB Keyboard (1462:1565)"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
nusb = "0.2"
thiserror = "2.0"

[dev-dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
